<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc"><title id="title">От сценария к результату</title><desc id="desc">Исходник СППР компилируется в feature. Самостоятельная feature не требует этого этапа. Vanessa управляет клиентом тестовой базы, результаты возвращаются в редактор.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#50717b" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#1e3540}.title{font-size:25px;font-weight:700}.label{font-size:19px;font-weight:700}.body{font-size:16px}.muted{fill:#526a75}.line{fill:none;stroke:#50717b;stroke-width:2;marker-end:url(#arrow)}</style><rect width="100%" height="100%" rx="14" fill="#f4f7f8"/><text x="26" y="43" class="title">Один рабочий процесс. Два вида исходников.</text><rect x="26" y="82" width="280" height="108" rx="9" fill="#ffffff" stroke="#ccd9df"/><text x="46" y="114" class="label">Исходник СППР</text><text x="46" y="143" class="body">scen.yaml / process.yaml</text><text x="46" y="165" class="body">или scen.feature + meta.yaml</text><rect x="355" y="82" width="270" height="108" rx="9" fill="#ffffff" stroke="#ccd9df"/><text x="375" y="114" class="label">Компиляция СППР</text><text x="375" y="143" class="body">Внешняя обработка .epf</text><text x="375" y="165" class="body">Профиль и настройки запуска</text><rect x="675" y="82" width="240" height="108" rx="9" fill="#ffffff" stroke="#ccd9df"/><text x="695" y="114" class="label">Собранная feature</text><text x="695" y="143" class="body">Шаги + JSON + карта</text><path class="line" d="M306 136H345"/><path class="line" d="M625 136H665"/><rect x="26" y="229" width="280" height="92" rx="9" fill="#ffffff" stroke="#ccd9df"/><text x="46" y="261" class="label">Самостоятельная feature</text><text x="46" y="290" class="body">Обычный тест Vanessa</text><text x="357" y="270" class="muted body">Компиляция СППР</text><text x="357" y="294" class="muted body">не требуется</text><path class="line" d="M306 310H645V275H665"/><path class="line" d="M795 190V220"/><rect x="675" y="229" width="240" height="92" rx="9" fill="#e1f1ee" stroke="#ccd9df"/><text x="695" y="261" class="label">Vanessa Automation</text><text x="695" y="290" class="body">Запуск и MCP-управление</text><rect x="965" y="229" width="285" height="92" rx="9" fill="#ffffff" stroke="#ccd9df"/><text x="985" y="261" class="label">Клиент тестирования</text><text x="985" y="290" class="body">Проверяемая база 1С</text><path class="line" d="M915 275H955"/><rect x="26" y="357" width="1224" height="49" rx="8" fill="#d9e9f2"/><text x="47" y="388" class="label">Результат в KOT: строки шагов · ошибки · переменные · журнал · диагностика</text></svg>