<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="530" viewBox="0 0 1280 530" role="img" aria-labelledby="title desc"><title id="title">Карта интерфейса KOT</title><desc id="desc">Схема расположения областей, а не скриншот. Слева находятся менеджер тестов, базы и библиотека, в центре исходник, справа свойства и переменные, внизу состояние Vanessa.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#50717b" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#1e3540}.title{font-size:25px;font-weight:700}.label{font-size:19px;font-weight:700}.body{font-size:16px}.muted{fill:#526a75}.line{fill:none;stroke:#50717b;stroke-width:2;marker-end:url(#arrow)}</style><rect width="100%" height="100%" rx="14" fill="#f4f7f8"/><text x="26" y="43" class="title">Рабочая область KOT for 1C</text><text x="26" y="71" class="muted body">Схема расположения: привычный редактор VS Code и панели по задачам</text><rect x="26" y="99" width="55" height="360" fill="#dce7ec" stroke="#c9d6dd"/><rect x="81" y="99" width="265" height="360" fill="#e9eff2" stroke="#c9d6dd"/><rect x="346" y="99" width="548" height="360" fill="#ffffff" stroke="#c9d6dd"/><rect x="894" y="99" width="360" height="360" fill="#e9eff2" stroke="#c9d6dd"/><circle cx="54" cy="139" r="17" fill="#2c6570"/><text x="54" y="145" text-anchor="middle" font-size="17" fill="white" style="fill:white">K</text><circle cx="54" cy="204" r="17" fill="#2c6570"/><text x="54" y="210" text-anchor="middle" font-size="17" fill="white" style="fill:white">L</text><circle cx="54" cy="269" r="17" fill="#2c6570"/><text x="54" y="275" text-anchor="middle" font-size="17" fill="white" style="fill:white">B</text><text x="103" y="135" class="label">1  Выбрать тесты</text><text x="103" y="171" class="body">Менеджер тестов</text><text x="103" y="196" class="body">Главные сценарии</text><text x="103" y="221" class="body">Процессы</text><text x="103" y="246" class="body">Самостоятельные feature</text><path d="M99 285H327" stroke="#bdcdd5"/><text x="103" y="315" class="body">Библиотека определений</text><text x="103" y="340" class="body">Информационные базы</text><text x="103" y="365" class="body">Клиенты тестирования</text><text x="370" y="135" class="label">2  Написать и проверить</text><text x="370" y="171" class="muted body">Редактор исходника</text><rect x="369" y="197" width="501" height="124" rx="6" fill="#f0f6f8"/><text x="390" y="229" class="body">And I prepare workshop customer</text><text x="390" y="254" class="body">    Customer = &quot;[Customer]&quot;</text><text x="390" y="279" class="body"></text><text x="390" y="304" class="body">F12: определение · F11: один шаг</text><text x="370" y="365" class="body">Подсказки · параметры · диагностика</text><text x="370" y="390" class="body">Полные панели открываются здесь же</text><text x="917" y="135" class="label">3  Изменить свойства</text><text x="917" y="171" class="body">Сохранить · Run · звезда · булавка</text><text x="917" y="196" class="body">Шапка и описание</text><text x="917" y="221" class="body">Параметры и вложенные вызовы</text><text x="917" y="246" class="body">Настройки запуска и файлы</text><path d="M912 286H1235" stroke="#bdcdd5"/><text x="917" y="317" class="label">Переменные сеанса</text><text x="917" y="352" class="body">Текущие значения Vanessa</text><rect x="26" y="459" width="1228" height="43" fill="#2c6570"/><text x="45" y="487" class="label" style="fill:white">4  Состояние подключения Vanessa — в нижней строке VS Code</text></svg>