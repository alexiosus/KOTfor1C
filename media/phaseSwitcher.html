<!DOCTYPE html>
<html lang="${localeHtmlLang}">
<head>
    <title>${extDisplayName}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src ${webview.cspSource}; font-src ${webview.cspSource}; img-src ${webview.cspSource} https:; script-src 'nonce-${nonce}';">
    <link href="${codiconsUri}" rel="stylesheet">
    <link href="${stylesUri}" rel="stylesheet">
    <link href="${sidebarStylesUri}" rel="stylesheet">
</head>
<body>
    <div class="app-shell phase-switcher-app">
        <section class="panel phase-switcher-section">
            <div id="scenarioSearchRow" class="scenario-search-row kot-sidebar-search">
                <div class="scenario-search-input-wrap search-frame kot-search-frame">
                    <span class="codicon codicon-search scenario-search-icon kot-search-icon" aria-hidden="true"></span>
                    <input
                        id="scenarioSearchInput"
                        class="scenario-search-input search-input kot-search-input"
                        type="text"
                        placeholder="${loc.scenarioSearchPlaceholder}"
                        title="${loc.scenarioSearchTitle}">
                    <button
                        id="scenarioSearchClearBtn"
                        class="scenario-search-clear-btn ghost-btn icon-only kot-search-clear hidden"
                        type="button"
                        title="${loc.scenarioSearchClearTitle}"
                        aria-label="${loc.scenarioSearchClearTitle}">
                        <span class="codicon codicon-close"></span>
                    </button>
                </div>
            </div>

            <div id="selectionSummary" class="selection-summary">
                <label class="selection-summary-toggle" for="selectAllBtn">
                    <input id="selectAllBtn" type="checkbox" aria-label="${loc.selectVisible}" title="${loc.selectVisible}">
                    <span>${loc.selectVisible}</span>
                </label>
                <span class="selection-summary-count"><strong id="selectedCount">0</strong> ${loc.of} <span id="selectableCount">0</span> ${loc.selected}</span>
                <button id="clearSelectionBtn" class="selection-clear-btn" type="button">${loc.clearSelection}</button>
            </div>

            <div id="phaseTreeContainer" class="phase-tree-container manager-view-panel kot-tree" role="tree">
                <p class="kot-loading">${loc.loadingPhasesAndTests}</p>
            </div>

            <div class="phase-switcher-controls-fixed-bottom surface-card">
                <div id="statusBar" class="status-bar">${loc.statusInit}</div>

                <div class="phase-switcher-controls">
                    <div class="controls-row controls-row-primary">
                        <div id="assembleSplitContainer" class="dropdown-container split-button">
                            <button id="assembleTestsBtn" class="button-with-icon toolbar-btn primary split-main-btn">
                                <span class="split-main-content">
                                    <span class="codicon codicon-beaker"></span>
                                    <span class="split-main-label">${loc.buildTests}</span>
                                </span>
                            </button>
                            <button id="assembleMenuBtn" class="button-with-icon toolbar-btn primary split-menu-btn icon-only kot-icon-button" title="${loc.buildOptionsTitle}" aria-label="${loc.buildOptionsTitle}">
                                <span class="codicon codicon-chevron-down"></span>
                            </button>
                            <div id="assembleDropdownContent" class="dropdown-content menu-popover split-dropdown-content">
                                <div id="yamlProfileRow" class="dropdown-control-row assemble-option-group" title="${loc.profile}">
                                    <label for="yamlProfileSelect" class="drive-accounting-label section-label">${loc.profile}</label>
                                    <div class="profile-control-line">
                                        <select id="yamlProfileSelect" class="surface-select assemble-profile-select" aria-label="${loc.profile}" title="${loc.profile}"></select>
                                        <button id="openYamlParametersQuickBtn" class="toolbar-btn ghost-btn icon-only kot-icon-button" type="button" title="${loc.openYamlParametersManagerTitle}" aria-label="${loc.openYamlParametersManagerTitle}">
                                            <span class="codicon codicon-json"></span>
                                        </button>
                                    </div>
                                </div>
                                <div id="driveAccountingModeRow" class="dropdown-control-row assemble-option-group" title="${loc.recordGLSelectTitle}">
                                    <label for="recordGLSelect" class="drive-accounting-label section-label">${loc.accountingMode}</label>
                                    <select id="recordGLSelect" class="surface-select assemble-profile-select" aria-label="${loc.accountingMode}" title="${loc.recordGLSelectTitle}">
                                        <option value="0">GL-</option>
                                        <option value="1">GL+</option>
                                        <option value="2" selected>Templates</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <button id="cancelAssembleBtn" class="button-with-icon ghost-btn danger-btn" title="${loc.cancelBuildTitle}">
                            <span class="codicon codicon-stop-circle"></span> ${loc.cancelBuild}
                        </button>
                        <button id="openVanessaBtn" class="button-with-icon toolbar-btn primary" type="button" title="${loc.runVanessaTopTitle}">
                            <img class="vanessa-automation-logo" src="${vanessaLogoUri}" alt="">
                            <span>${loc.runVanessaTopTitle}</span>
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </div>
    <script type="application/javascript" nonce="${nonce}">window.__loc = ${webviewLoc};</script>
    <script type="application/javascript" nonce="${nonce}" src="${protocolScriptUri}"></script>
    <script type="application/javascript" nonce="${nonce}" src="${scenarioFilesProtocolScriptUri}"></script>
    <script type="application/javascript" nonce="${nonce}" src="${scriptUri}"></script>
</body>
</html>
